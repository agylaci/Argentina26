let current=0;
const $=s=>document.querySelector(s);
function imageSrc(obj, hero=false){
  if(obj.heroLocal) return IMGS[obj.heroLocal];
  if(obj.imageLocal) return IMGS[obj.imageLocal];
  const fb=IMGS[obj.fallback||'andes'];
  const key= hero ? obj.heroKey : obj.imageKey;
  return {fallback:fb,remote:key?REMOTE[key]:null};
}
function setImg(el, spec){
  if(typeof spec==='string'){el.src=spec;return}
  el.src=spec.fallback;
  if(spec.remote){const test=new Image(); test.onload=()=>el.src=spec.remote; test.src=spec.remote;}
}
function renderNav(){ const n=$('#daybar'); n.innerHTML=''; DAYS.forEach((d,i)=>{let b=document.createElement('button');b.className='daybtn'+(i===current?' active':'');b.innerHTML=`Day ${d.n}<small>${d.date.slice(5).replace('-','.')}</small>`;b.onclick=()=>render(i);n.appendChild(b)}); requestAnimationFrame(()=>n.children[current]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}));}
function eventHTML(e){
 let img=''; if(e.imageLocal||e.imageKey) img=`<img class="evt-img" data-local="${e.imageLocal||''}" data-key="${e.imageKey||''}" data-fallback="${e.fallback||'andes'}" alt="${e.title}">`;
 let facts=e.facts?.length?`<div class="facts">${e.facts.map(x=>`<div class="fact">${x}</div>`).join('')}</div>`:'';
 return `<article class="event"><div class="etime">${e.time}</div><span class="dot"></span><div class="event-card">${img}<div class="event-body"><div class="tag">${e.icon||'•'} ${e.type||''}</div><h3>${e.title}</h3><p>${e.desc||''}</p>${e.status?`<span class="status">${e.status}</span>`:''}${facts}</div></div></article>`
}
function render(i){ current=i; const d=DAYS[i]; window.scrollTo({top:0,behavior:'smooth'}); renderNav();
  $('#eyebrow').textContent=`ARGENTINA 2026 · DAY ${d.n} · ${d.dateLabel}`;
  $('#heroTitle').textContent=d.city; $('#heroSub').textContent=d.headline; setImg($('#heroImg'),imageSrc(d,true));
  let w=d.weather?`<div class="weather"><div class="left"><div class="wicon">${d.weather.icon}</div><div><strong>${d.weather.summary}</strong><small>Forecast snapshot · Oct 6 · később frissítjük</small></div></div><div class="temps"><span>MAX / MIN</span>${d.weather.hi} · ${d.weather.lo}</div></div>`:'';
  let tr=d.transport?.length?`<div class="section-title"><div class="k">Transport</div><h2>On the move</h2></div><div class="transport">${d.transport.map(t=>`<div class="transport-card"><div><div class="r">${t.route}</div><div class="t">${t.time}</div></div><div class="i">${t.icon}</div></div>`).join('')}</div>`:'';
  let timeline=`<div class="section-title"><div class="k">Today's journey</div><h2>${d.headline}</h2></div><div class="timeline">${d.events.map(eventHTML).join('')}</div>`;
  let notes=d.notes?.length?`<div class="section-title"><div class="k">Practical</div><h2>Good to know</h2></div><div class="notes"><ul>${d.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`:'';
  let details=(d.stay||d.food?.length)?`<div class="section-title"><div class="k">Day details</div><h2>Food & stay</h2></div><div class="grid">${d.stay?`<div class="info-card"><div class="label">Stay</div><h3>${d.stay}</h3><p>Ahol a spreadsheet nem tartalmaz pontos hotelnevet, ott TBC marad.</p></div>`:''}${d.food?.length?`<div class="info-card"><div class="label">Food</div><h3>Planned / suggestions</h3>${d.food.map(f=>`<div class="foodline">🍽️ ${f}</div>`).join('')}</div>`:''}</div>`:'';
  let explore=d.city.includes('Buenos Aires')?`<button class="exploreBtn" onclick="document.querySelector('.explore').classList.toggle('open')">Explore Buenos Aires · extra ötletek</button><div class="explore">${EXPLORE.map(x=>`<div class="place"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div>`:'';
  let pn=`<div class="prevnext"><button class="nav2 secondary" ${i===0?'disabled':''} onclick="render(${Math.max(0,i-1)})">← Előző nap</button><button class="nav2" ${i===DAYS.length-1?'disabled':''} onclick="render(${Math.min(DAYS.length-1,i+1)})">Következő nap →</button></div>`;
  $('#content').innerHTML=w+tr+timeline+notes+details+explore+pn+`<div class="credits">A program a feltöltött Argentina 2026 spreadsheetből készült. Az érzékeny repülési azonosítók és booking reference-ek nincsenek publikálva. Az időjárás a 2026. október 6-án látható előrejelzés ideiglenes snapshotja.</div>`;
  document.querySelectorAll('.evt-img').forEach(el=>{const local=el.dataset.local,key=el.dataset.key,fb=el.dataset.fallback; if(local)setImg(el,IMGS[local]); else setImg(el,{fallback:IMGS[fb],remote:REMOTE[key]})})
}
function initialDay(){const now=new Date();const start=new Date('2026-10-09T00:00:00-03:00');const end=new Date('2026-10-20T23:59:59-03:00');if(now<start)return 0;if(now>end)return 11;const iso=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);let x=DAYS.findIndex(d=>d.date===iso);return x>=0?x:0;}
render(initialDay());
</script></body></html>
